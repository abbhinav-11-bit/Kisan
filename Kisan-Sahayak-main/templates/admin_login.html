{% extends "base.html" %}

{% block title %}Admin Access Portal — Shram Setu{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card" style="max-width: 480px;">
    <div class="auth-header">
      <div class="logo-badge" style="width: 56px; height: 56px; font-size: 1.5rem; margin: 0 auto 1rem; background: linear-gradient(135deg, #7c2d12, #b91c1c);">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h1 class="auth-title">Admin Access Portal</h1>
      <p style="color: var(--text-muted); font-size: 0.92rem;">
        Secure administrator login for monitoring farmers, resources, and platform activity.
      </p>
    </div>

    <form action="{{ url_for('admin_login') }}" method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <div class="form-group">
        <label for="adminUsername" class="form-label">Admin Username</label>
        <input type="text" name="username_or_email" id="adminUsername" class="form-control" placeholder="Enter admin username" required autofocus>
      </div>

      <div class="form-group">
        <label for="adminPassword" class="form-label">Admin Password</label>
        <input type="password" name="password" id="adminPassword" class="form-control" placeholder="Enter admin password" required>
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1rem;">
        <i class="fa-solid fa-right-to-bracket"></i> Login as Admin
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-light); font-size: 0.9rem; color: var(--text-muted);">
      Need farmer access instead?
      <a href="{{ url_for('login') }}" style="font-weight: 700; color: var(--primary-green);">Go to Farmer Login</a>
    </div>
  </div>
</div>
{% endblock %}
